# 阿粤 720P 视频重拍管线（Wan I2V 底片 + InfiniteTalk V2V 对口型）
#
# 路线（2026-08-01 定案）：权重 R2-first、HF 兜底、首跑 tee 回 R2；
# 本地（thursday-win/Clash）零上传。发射前必须过 docker 预检
# （见 gpu-burst-infra 方法论：setup 块本地同镜像逐字跑绿再发射）。
#
# ✅ 前置验证已完成（2026-08-01）：
#  1. InfiniteTalk = Kijai/WanVideo_comfy: InfiniteTalk/Wan2_1-InfiniTetalk-Single_fp16.safetensors (5.1GB)
#  2. 720P 蒸馏 LoRA 不存在于 Kijai 仓库 → 默认挂 480p rank64 LoRA 跑 720P
#     （与本地 720P A/B 同组合）；无 LoRA 20 步原生采样留作云上 A/B 对照
#  3. commit 钉版（照抄 thursday-win 现网）：ComfyUI b3581971 /
#     WanVideoWrapper 088128b / VideoHelperSuite 4ee72c0；
#     wav2vec = TencentGameMate/chinese-wav2vec2-base
#
# 用法（全部需用户终端亲跑付费命令）：
#   sky launch -c ayue-720p sky/ayue-video-720p.yaml --idle-minutes-to-autostop 10 --down -y

resources:
  cloud: vast
  accelerators: RTX4090:1     # 24GB：720P fp8 主模型 17GB + 激活
  disk_size: 80               # 权重 ~30GB + ComfyUI + 输出
  # 不指定 image：用 SkyPilot 默认镜像（8/1 的 A/B 样片就是这么渲出来的，
  # miniconda 路径已实测）。预烤镜像的 CMD/sshd 机制未吃透前不引入。

envs:
  AYUE_FIRST_CLIP_BUDGET_S: "840"   # 速度闸门：首支超 14min 即弃机（快卡 ~7min）
  R2_ENDPOINT: https://1df50a43697ddc762baf3b76d1dc9ef1.r2.cloudflarestorage.com
  R2_CACHE: gpu-burst-cache
  R2_JOBS: gpu-burst-jobs

file_mounts:
  # 任务包：job JSON（720x1280 版工作流）+ 源音频 + 母版图
  /job: ./tasks/ayue-720p-19-jobpack
  # R2 凭证走 file_mounts，不要用「后台 launch + ssh 注入」——那个包装层会让
  # sky launch 提前退出，--down 随即拆机（2026-08-01 整批首发就这么废了一次）。
  /root/.aws/credentials: ~/.config/gpu-burst/r2-credentials

setup: |
  set -euo pipefail
  # ---- 驱动门禁：黄金栈是 torch 2.13+cu130，宿主机驱动必须 >= 580（CUDA 13）----
  # 2026-08-01 整批失败的真根因：租到 CUDA 12.8 驱动的宿主机。不达标就立刻失败，
  # 让发射方 down 掉换机，别浪费后续 setup 时间。
  DRV=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | cut -d. -f1)
  [ "$DRV" -ge 580 ] || { echo "DRIVER-TOO-OLD: $DRV < 580 (need CUDA 13)"; exit 47; }
  echo "driver ok: $DRV"
  # Vast 默认镜像的 conda 是 python 3.10，黄金 freeze 需要 >=3.12
  # （av==18.0.0 等直接拒装，2026-08-03 实测）。先建 3.12 环境再精确重放。
  /root/miniconda3/bin/conda create -y -q -n ayue python=3.12
  PY=/root/miniconda3/envs/ayue/bin/python; PIP="$PY -m pip"
  # env 的 bin 必须进 PATH：fetch_weights.sh 里的 s5cmd/hf 是裸命令，
  # 不进 PATH 时 s5cmd 的 R2 分支被 2>/dev/null 吞掉静默漏到 HF，
  # hf 则直接 127（2026-08-03 实测）。
  export PATH=/root/miniconda3/envs/ayue/bin:$PATH
  $PY --version
  git clone https://github.com/comfyanonymous/ComfyUI /root/ComfyUI && git -C /root/ComfyUI checkout b3581971
  git clone https://github.com/kijai/ComfyUI-WanVideoWrapper /root/ComfyUI/custom_nodes/ComfyUI-WanVideoWrapper && git -C /root/ComfyUI/custom_nodes/ComfyUI-WanVideoWrapper checkout 088128b
  git clone https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite /root/ComfyUI/custom_nodes/ComfyUI-VideoHelperSuite && git -C /root/ComfyUI/custom_nodes/ComfyUI-VideoHelperSuite checkout 4ee72c0
  git clone https://github.com/kijai/ComfyUI-KJNodes /root/ComfyUI/custom_nodes/ComfyUI-KJNodes
  # ---- 黄金 freeze 精确重放：thursday-win 生产环境（每天在跑这条管线）的 pip freeze，
  #      不是滚动 requirements。cu130 轮子从 pytorch 官方 index 拉。----
  $PIP install -r /job/golden-freeze.txt --extra-index-url https://download.pytorch.org/whl/cu130
  $PIP install s5cmd huggingface_hub[hf_transfer]
  # 权重：R2-first（已全量缓存），HF 兜底
  bash /job/fetch_weights.sh

run: |
  set -euo pipefail
  export PYTHONPATH="${PYTHONPATH:-}"
  # 审计确认项：teach 阶段此前从未出现在任何发射路径里，5 支教学片永远不会渲。
  # 三个阶段顺序不可换：v2v 依赖 sources 的成片，queue_all.py 会做 output→input 搬运。
  export PATH=/root/miniconda3/envs/ayue/bin:$PATH
  cd /root/ComfyUI && /root/miniconda3/envs/ayue/bin/python main.py --listen 127.0.0.1 --port 8188 > /root/comfyui.log 2>&1 &
  cp /job/inputs/* /root/ComfyUI/input/
  /root/miniconda3/envs/ayue/bin/python /job/wait_comfy_ready.py
  /root/miniconda3/envs/ayue/bin/python /job/queue_all.py --stage sources
  /root/miniconda3/envs/ayue/bin/python /job/queue_all.py --stage v2v
  /root/miniconda3/envs/ayue/bin/python /job/queue_all.py --stage teach

  # 交付闸：29 次执行必须各出一支带音轨成片。审计确认真实文件名是
  # {prefix}_00001-audio.mp4，同名无后缀的那个是无声中间件——按无后缀名收片
  # 会拿到 15 支哑巴片，而且抽帧验收看不出来（回归 08-01 已修的「反馈是哑的」）。
  COUNT=$(ls /root/ComfyUI/output/a720_*-audio.mp4 2>/dev/null | wc -l)
  SILENT=$(ls /root/ComfyUI/output/a720_*_00001.mp4 2>/dev/null | wc -l)
  echo "DELIVERY-CHECK: ${COUNT} 支带音轨 / ${SILENT} 支无声中间件"

  # 先回传再判定：不足数也要把已渲成片和日志捞走，别随 --down 一起烧掉
  s5cmd --endpoint-url $R2_ENDPOINT cp "/root/ComfyUI/output/*" "s3://$R2_JOBS/ayue-720p-$(date +%Y%m%d)/output/" || echo upload-partial-failed
  s5cmd --endpoint-url $R2_ENDPOINT cp /root/comfyui.log "s3://$R2_JOBS/ayue-720p-$(date +%Y%m%d)/comfyui.log" || true

  test "$COUNT" -ge 29 || { echo "INCOMPLETE: 带音轨成片 ${COUNT}/29" >&2; exit 48; }
  echo BATCH-COMPLETE
